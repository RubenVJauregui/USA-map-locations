<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNIS Facility Map Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f9;
      --panel: #ffffff;
      --panel-soft: #eef4f7;
      --ink: #18212b;
      --muted: #657485;
      --line: #cad6df;
      --blue: #1f6fbf;
      --blue-dark: #164f88;
      --gold: #f8b83f;
      --green: #1f8a6b;
      --red: #b64545;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
    }

    button, input {
      font: inherit;
    }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 240px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #10263c;
      color: var(--gold);
      font-size: 24px;
      line-height: 1;
    }

    .brand h1 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .unis-logo {
      width: 58px;
      height: 24px;
      display: inline-block;
      flex: 0 0 auto;
      vertical-align: middle;
      text-transform: lowercase;
    }

    .brand-title-text {
      display: inline-block;
      height: 24px;
      font-size: 24px;
      line-height: 24px;
    }

    .unis-logo text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .search-wrap {
      flex: 1;
      max-width: 520px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdfe;
      color: var(--ink);
      padding: 0 14px;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31, 111, 191, .14);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .stat {
      min-width: 86px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdfe;
    }

    .stat strong {
      display: block;
      color: var(--ink);
      font-size: 17px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      padding: 18px;
      min-height: 0;
      overflow: hidden;
    }

    .map-card,
    .side-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      min-height: 0;
    }

    .map-card {
      display: grid;
      grid-template-rows: 1fr;
    }

    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .map-header h2,
    .side-panel h2,
    .detail h3 {
      margin: 0;
      font-size: 15px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 99px;
      background: var(--gold);
      box-shadow: inset 0 0 0 2px #9d650b;
    }

    #map {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 24% 20%, rgba(255, 255, 255, .72), rgba(255, 255, 255, 0) 36%),
        radial-gradient(ellipse at 78% 72%, rgba(70, 169, 190, .2), rgba(70, 169, 190, 0) 42%),
        linear-gradient(135deg, rgba(255,255,255,.5) 0 1px, transparent 1px 36px),
        linear-gradient(180deg, #eaf7fb 0%, #cfe8f0 52%, #b7dce8 100%);
    }

    #map::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255,255,255,0) 0 38%, rgba(255,255,255,.32) 49%, rgba(255,255,255,0) 62%),
        repeating-linear-gradient(28deg, rgba(22, 79, 136, .08) 0 1px, rgba(22, 79, 136, 0) 1px 18px);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    #map::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, .58);
      box-shadow: inset 0 0 44px rgba(14, 58, 86, .14);
      pointer-events: none;
      z-index: 4;
    }

    .map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 28px rgba(13, 36, 55, .16));
      z-index: 1;
    }

    .state-shape {
      fill: url(#landGradient);
      stroke: #91b9ac;
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity .16s ease, transform .16s ease, fill .16s ease, stroke .16s ease, filter .16s ease;
    }

    .state-shape:nth-child(4n + 1) { fill: url(#landWarm); }
    .state-shape:nth-child(4n + 2) { fill: url(#landCool); }
    .state-shape:nth-child(4n + 3) { fill: url(#landBright); }
    .state-shape.has-facility {
      stroke: #6fa897;
      stroke-width: 1.55;
      cursor: pointer;
    }
    .state-shape.is-muted {
      opacity: .34;
      filter: saturate(.65);
    }
    .state-shape.is-focused {
      fill: url(#activeLand);
      stroke: #0e6e86;
      stroke-width: 2.1;
      filter: drop-shadow(0 14px 20px rgba(12, 67, 84, .22));
      transform: scale(2);
    }

    .state-shape.has-facility:hover {
      stroke: #277f91;
      stroke-width: 1.75;
      filter: brightness(1.04);
    }

    .state-shape:focus {
      outline: none;
    }

    .marker-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .facility-star {
      position: absolute;
      pointer-events: auto;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 99px;
      background: transparent;
      cursor: pointer;
      transform: translate(-17px, -17px);
      transition: left .16s ease, top .16s ease, transform .14s ease;
      z-index: 2;
    }

    .facility-star::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 9px);
      max-width: 190px;
      min-width: max-content;
      padding: 6px 9px;
      border: 1px solid rgba(22, 79, 136, .28);
      border-radius: 7px;
      background: rgba(255, 255, 255, .98);
      color: var(--ink);
      box-shadow: 0 10px 26px rgba(13, 36, 55, .24);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transform: translate(-50%, 4px);
      transition: opacity .12s ease, transform .12s ease;
      white-space: nowrap;
      z-index: 5;
    }

    .facility-star::before {
      content: "★";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 99px;
      background: radial-gradient(circle at 35% 28%, #fff4b8 0 18%, #f8c23f 42%, #e89d1e 100%);
      color: #5b3500;
      border: 2px solid #7d4f08;
      box-shadow:
        0 0 0 5px rgba(248, 184, 63, .24),
        0 8px 20px rgba(13, 36, 55, .3);
      font-size: 19px;
      line-height: 1;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .facility-star:hover::before,
    .facility-star:focus-visible::before,
    .facility-star.is-active::before {
      transform: scale(1.18);
      background: radial-gradient(circle at 35% 28%, #fff8cf 0 18%, #ffd55d 42%, #f1a51b 100%);
      border-color: #4f3a03;
      box-shadow:
        0 0 0 8px rgba(248, 184, 63, .28),
        0 11px 28px rgba(13, 36, 55, .42);
    }

    .facility-star:hover::after,
    .facility-star:focus-visible::after,
    .facility-star.is-active::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .facility-star.needs-review::before {
      background: radial-gradient(circle at 35% 28%, #ffe5d1 0 18%, #f6b58e 48%, #e18552 100%);
      color: #6a3014;
      border-color: #a75025;
    }

    .side-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
      overscroll-behavior: contain;
    }

    .side-panel.rich-mode {
      grid-template-rows: 1fr;
    }

    .side-panel.rich-mode .list-header,
    .side-panel.rich-mode .facility-list {
      display: none;
    }

    .detail {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #f6fafc);
    }

    .side-panel.rich-mode .detail {
      overflow: auto;
      overscroll-behavior: contain;
      border-bottom: 0;
    }

    .detail h3 {
      margin-bottom: 7px;
      font-size: 20px;
    }

    .detail p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: #334554;
      font-size: 12px;
      font-weight: 650;
    }

    .pill.review {
      background: #fff0e8;
      color: var(--red);
    }

    .future-slot {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed #9fb1bf;
      border-radius: 8px;
      background: #f9fbfc;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .rich-facility {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 6px;
    }

    .rich-hero {
      display: block;
      min-height: 190px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 0;
      background-position: center;
      background-size: cover;
      background-color: transparent;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .rich-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 25, 42, .08), rgba(8, 25, 42, .55));
    }

    .rich-hero:focus-visible,
    .gallery-photo:focus-visible {
      outline: 3px solid rgba(31, 111, 191, .32);
      outline-offset: 2px;
    }

    .detail-map {
      aspect-ratio: 16 / 9;
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #eaf3f7;
    }

    .detail-map iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .facility-visuals {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .visual-frame {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #eaf3f7;
    }

    .visual-frame strong {
      display: block;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfdfe;
      color: var(--ink);
      font-size: 12px;
    }

    .visual-frame iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 190px;
      display: block;
      border: 0;
    }

    .visual-frame .gallery-photo {
      width: 100%;
      border: 0;
      border-radius: 0;
    }

    .visual-frame .gallery-photo img {
      aspect-ratio: 16 / 9;
      min-height: 190px;
    }

    .rich-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rich-section h4 {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.2;
    }

    .top-customers-header {
      display: grid;
      grid-template-columns: minmax(110px, .9fr) minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
    }

    .top-customers-header h4 {
      margin: 0;
    }

    .rich-section p,
    .rich-section li,
    .rich-section dd {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .rich-section p,
    .rich-section dl,
    .rich-section ul {
      margin: 0;
    }

    .rich-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rich-link,
    .back-button {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfdfe;
      color: var(--blue-dark);
      cursor: pointer;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .rich-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .rich-row {
      display: grid;
      grid-template-columns: minmax(110px, .9fr) minmax(0, 1fr);
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #e1e9ef;
    }

    .rich-row dt {
      color: var(--muted);
      font-size: 12px;
    }

    .rich-row dd {
      margin: 0;
      color: var(--ink);
      font-weight: 700;
    }

    .space-card,
    .nearby-card {
      border: 1px solid #dce6ee;
      border-radius: 8px;
      background: #fbfdfe;
      padding: 10px;
    }

    .space-card strong,
    .nearby-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .space-card ul {
      padding-left: 18px;
    }

    .amenity-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .amenity-list span {
      border-radius: 999px;
      background: var(--panel-soft);
      color: #334554;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .gallery-photo {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    .gallery-photo img {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      border: 1px solid #dce6ee;
      object-fit: cover;
      display: block;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .gallery-photo:hover img {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(13, 36, 55, .2);
    }

    .nearby-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nearby-card span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(10, 24, 38, .72);
    }

    .image-lightbox[hidden] {
      display: none;
    }

    .image-lightbox-inner {
      position: relative;
      max-width: 94vw;
      max-height: 92vh;
    }

    .image-lightbox img {
      width: var(--preview-width, min(900px, 88vw));
      max-width: 88vw;
      max-height: 86vh;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
      object-fit: contain;
      display: block;
    }

    .image-lightbox-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .32);
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .list-header h2 {
      font-size: 14px;
    }

    .clear-button {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfdfe;
      color: var(--blue-dark);
      cursor: pointer;
      padding: 0 10px;
      font-weight: 650;
      font-size: 12px;
    }

    .facility-list {
      overflow: auto;
      padding: 8px;
      overscroll-behavior: contain;
    }

    .state-group-title {
      margin: 12px 4px 5px;
      padding: 8px 4px 5px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
    }

    .state-group-title:first-child {
      margin-top: 4px;
    }

    .facility-button {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: start;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 9px;
      text-align: left;
    }

    .facility-button:hover,
    .facility-button.is-active {
      background: #edf5fb;
    }

    .facility-button .mini-star {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 99px;
      background: var(--gold);
      color: #5b3500;
      font-size: 13px;
      border: 1px solid #9d650b;
    }

    .facility-button.needs-review .mini-star {
      background: #f6c1a2;
      color: #6a3014;
      border-color: #a75025;
    }

    .facility-button strong,
    .facility-button span {
      display: block;
    }

    .facility-button strong {
      font-size: 13px;
      line-height: 1.2;
    }

    .facility-button span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .empty {
      padding: 18px 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 1020px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .search-wrap {
        max-width: none;
      }

      .stats {
        width: 100%;
      }

      .stat {
        flex: 1;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      #map {
        height: 62vh;
      }

      .side-panel {
        max-height: none;
      }
    }

    @media (max-width: 560px) {
      .dashboard {
        padding: 10px;
      }

      .topbar {
        padding: 14px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }

      .legend {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="UNIS Facility Map">
        <div class="brand-mark" aria-hidden="true">★</div>
        <div>
          <h1>
            <svg class="unis-logo" viewBox="0 0 58 24" role="img" aria-label="UNIS">
              <text x="0" y="20" fill="#df2b22">u</text>
              <text x="15" y="20" fill="#12a15f">n</text>
              <text x="31" y="20" fill="#0e8ecf">i</text>
              <text x="40" y="20" fill="#f2b600">s</text>
            </svg>
            <span class="brand-title-text">Facility Map</span>
          </h1>
          <span>United States facility dashboard</span>
        </div>
      </div>
      <div class="stats" aria-label="Facility totals">
        <div class="stat"><strong id="facilityCount">25</strong>Facilities</div>
        <div class="stat"><strong id="stateCount">13</strong>States</div>
      </div>

    function getStateBox(stateCode) {
      if (!stateCode) return null;
      if (stateBoxes.has(stateCode)) return stateBoxes.get(stateCode);

      const shape = Array.from(document.querySelectorAll(".state-shape"))
        .find((item) => stateNameToCode[item.dataset.state] === stateCode);
      if (!shape) return null;

      const coords = (shape.getAttribute("d").match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      const xs = [];
      const ys = [];
      for (let index = 0; index < coords.length; index += 2) {
        xs.push(coords[index]);
        ys.push(coords[index + 1]);
      }
      const x = Math.min(...xs);
      const y = Math.min(...ys);
      const box = {
        x,
        y,
        width: Math.max(...xs) - x,
        height: Math.max(...ys) - y
      };
      stateBoxes.set(stateCode, box);
      return box;
    }

    function projectFacility(facility) {
      const stateBounds = stateGeoBounds[facility.state];
      const stateBox = getStateBox(facility.state);
      if (stateBounds && stateBox) {
        const lngPosition = (facility.lng - stateBounds.minLng) / (stateBounds.maxLng - stateBounds.minLng);
        const latPosition = (stateBounds.maxLat - facility.lat) / (stateBounds.maxLat - stateBounds.minLat);
        const x = stateBox.x + Math.min(1, Math.max(0, lngPosition)) * stateBox.width;
        const y = stateBox.y + Math.min(1, Math.max(0, latPosition)) * stateBox.height;
        return {
          x: Math.min(95, Math.max(5, x / 10)),
          y: Math.min(92.38, Math.max(7.63, y / 5.9))
        };
      }

      const toRadians = Math.PI / 180;
      const phi1 = 29.5 * toRadians;
      const phi2 = 45.5 * toRadians;
      const phi0 = 38 * toRadians;
      const n = (Math.sin(phi1) + Math.sin(phi2)) / 2;
      const c = Math.cos(phi1) ** 2 + 2 * n * Math.sin(phi1);
      const rho0 = Math.sqrt(c - 2 * n * Math.sin(phi0)) / n;
      const lambda = (facility.lng + 96) * toRadians;
      const phi = facility.lat * toRadians;
      const rho = Math.sqrt(c - 2 * n * Math.sin(phi)) / n;
      const rawX = rho * Math.sin(n * lambda);
      const rawY = rho0 - rho * Math.cos(n * lambda);
      const x = 500 + rawX * 1200;
      const y = 315 - rawY * 1050;
      return {
        x: Math.min(95, Math.max(5, x / 10)),
        y: Math.min(92.38, Math.max(7.63, y / 5.9))
      };
    }

    function getStateCenter(stateCode) {
      if (!stateCode) return null;
      if (stateCenters.has(stateCode)) return stateCenters.get(stateCode);

      const shape = Array.from(document.querySelectorAll(".state-shape"))
        .find((item) => stateNameToCode[item.dataset.state] === stateCode);
      if (!shape) return null;

      const box = shape.getBBox();
      const center = {
        x: ((box.x + box.width / 2) / 1000) * 100,
        y: ((box.y + box.height / 2) / 590) * 100
      };
      stateCenters.set(stateCode, center);
      return center;
    }

    function focusedPosition(facility, focusStateCode) {
      const base = projectFacility(facility);
      if (facility.state !== focusStateCode) return base;

      const center = getStateCenter(focusStateCode);
      if (!center) return base;
      return {
        x: center.x + (base.x - center.x) * stateFocusScale,
        y: center.y + (base.y - center.y) * stateFocusScale
      };
    }

    function placeMarkers(focusStateCode = focusedState) {
      for (const facility of facilities) {
        const entry = markers.get(facility.name);
        if (!entry) continue;
        const position = focusedPosition(facility, focusStateCode);
        entry.marker.style.left = `${position.x}%`;
        entry.marker.style.top = `${position.y}%`;
        entry.marker.style.zIndex = facility.priority ? "18" : (facility.state === focusStateCode ? "14" : "");
      }
    }

    function focusState(stateCode) {
      if (stateCode && !facilityStateCodes.has(stateCode)) {
        clearStateFocus();
        return;
      }
      focusedState = stateCode || "";
      document.querySelectorAll(".state-shape").forEach((shape) => {
        const code = stateNameToCode[shape.dataset.state] || "";
        shape.classList.toggle("is-focused", Boolean(focusedState) && code === focusedState);
        shape.classList.toggle("is-muted", Boolean(focusedState) && code !== focusedState);
      });
      placeMarkers(focusedState);
    }

    function clearStateFocus() {
      focusedState = "";
      document.querySelectorAll(".state-shape").forEach((shape) => {
        shape.classList.remove("is-focused", "is-muted");
      });
      placeMarkers("");
    }

    function escapeHtml(value) {
      const replacements = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(value ?? "").replace(/[&<>"']/g, (character) => replacements[character]);
    }

    function safeExternalUrl(value) {
      try {
        const parsed = new URL(value);
        return parsed.protocol === "https:" ? parsed.href : "";
      } catch {
        return "";
      }
    }

    function safeMediaUrl(value) {
      try {
        const parsed = new URL(value, window.location.href);
        const isSameOrigin = parsed.origin === window.location.origin;
        return isSameOrigin || parsed.protocol === "https:" ? String(value) : "";
      } catch {
        return "";
      }
    }

        : facilityStreetPictures[facility.name];
      const streetPictureHtml = streetPicture ? `
        <button class="gallery-photo enlarge-photo" type="button" data-src="${streetPicture.src}" data-alt="${streetPicture.alt}" aria-label="Enlarge ${streetPicture.alt}">
          <img src="${streetPicture.src}" alt="${streetPicture.alt}" loading="lazy">
        </button>
      ` : `
        <iframe
          title="${title} street picture"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="${streetViewSrc}">
        </iframe>
      `;
      return `
        <section class="rich-section">
          <h4>Facility Views</h4>
          <div class="facility-visuals">
            <div class="visual-frame">
              <strong>Street picture</strong>
              ${streetPictureHtml}
            </div>
            ${satelliteAerialFrameHtml(facility, title)}
          </div>
        </section>
      `;
    }

    function renderGenericFacilityDetails(facility) {
      const data = unisCatalogDetails[facility.name];
      const listingData = facilityListingDetails[facility.name];
      const title = data?.title || facility.name;
      const summary = data?.summary || "No dedicated UNIS website facility listing was found for this dashboard location. The dashboard address is shown below for reference.";
      const featureRows = listingData?.features?.length
        ? listingData.features
        : data?.facts && Object.keys(data.facts).length
          ? Object.entries(data.facts)
          : [
              ["Dashboard address", facility.address],
              ["City", facility.city],
              ["State", facility.state]
            ];
      const listingSourceUrl = safeExternalUrl(listingData?.sourceUrl);
      const visualsHtml = listingData
        ? aerialViewSectionHtml(facility, title)
        : `
            ${data?.image ? `<button class="rich-hero enlarge-photo" type="button" data-src="${data.image}" data-alt="${data.imageAlt || title}" aria-label="Enlarge ${title} facility image" style="background-image:url('${data.image}')"></button>` : ""}
            ${data?.image ? "" : fallbackVisualsHtml(facility, title)}
            ${data?.image ? aerialViewSectionHtml(facility, title) : ""}
          `;
      const navigationHtml = `
        <div class="rich-links">
          <button class="back-button" type="button" id="backToFacilityList">Back to facility list</button>
          ${listingSourceUrl ? `<a class="rich-link" href="${escapeHtml(listingSourceUrl)}" target="_blank" rel="noopener noreferrer">Source listing</a>` : ""}
        </div>
      `;
      const featureDetailsHtml = `
        <section class="rich-section">
          <h4>Features</h4>
          <dl class="rich-grid">${rowsHtml(featureRows)}</dl>
        </section>
        <section class="rich-section">
          <h4>Lease Highlights</h4>
          ${(listingData?.highlights || []).map((item) => `<p>${escapeHtml(item)}</p>`).join("")}
        </section>
        ${listingGalleryHtml(listingData?.gallery)}
      `;

      selectedName.textContent = title;
      selectedAddress.textContent = facility.address;
      selectedRegion.textContent = `${facility.city}, ${facility.state}`;
      selectedStatus.textContent = data ? "UNIS location catalog" : "";
      selectedStatus.className = "pill";
      selectedStatus.hidden = !data;
      futureSlot.innerHTML = `
        <div class="rich-facility">
          ${listingData ? `${navigationHtml}${featureDetailsHtml}${visualsHtml}` : `${visualsHtml}${navigationHtml}`}
          <section class="rich-section">
            <h4>AI Summary</h4>
            <p>${summary}</p>
          </section>
          ${listingData ? "" : featureDetailsHtml}
          ${data?.attachmentFacts ? `
            <section class="rich-section">
              <h4>Attachment Highlights</h4>
              <dl class="rich-grid">${objectRowsHtml(data.attachmentFacts)}</dl>
            </section>
          ` : ""}
          ${attachmentGalleryHtml(data?.attachmentImages)}
          <section class="rich-section">
            <h4>Property Overview</h4>
            <dl class="rich-grid">
              <div class="rich-row">
                <dt>Dashboard address</dt>
                <dd>${facility.address}</dd>
              </div>
              ${data?.officialAddress && data.officialAddress !== facility.address ? `
                <div class="rich-row">
                  <dt>UNIS catalog address</dt>
                  <dd>${data.officialAddress}</dd>
                </div>
              ` : ""}
              ${data?.directions ? `
                <div class="rich-row">
                  <dt>Directions</dt>
                  <dd>${data.directions}</dd>
                </div>
              ` : ""}
            </dl>
          </section>
          <div class="detail-map">
            <iframe
              title="${title} map"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps?q=${encodeURIComponent(facility.address)}&z=10&output=embed">
            </iframe>
          </div>
          ${topCustomersSectionHtml(facility.name)}
          ${managerSectionHtml(facility.name)}
        </div>
      `;
      document.getElementById("backToFacilityList")?.addEventListener("click", resetSelection);
      bindEnlargePhotos();
      bindListingImageFallbacks();
    }

    function renderValleyViewDetails() {
      const data = valleyViewDetails;
      const facility = facilities.find((item) => item.name === "Valley View");
      selectedName.textContent = data.title;
      selectedAddress.textContent = data.address;
      selectedRegion.textContent = "Buena Park, CA";
      selectedStatus.textContent = "UNIS facility page";
      selectedStatus.className = "pill";
      selectedStatus.hidden = false;
      futureSlot.innerHTML = `
        <div class="rich-facility">
          <button class="rich-hero enlarge-photo" type="button" data-src="${data.heroImage}" data-alt="Buena Park facility exterior" aria-label="Enlarge Buena Park facility exterior" style="background-image:url('${data.heroImage}')"></button>
          ${aerialViewSectionHtml(facility, data.title)}
          <div class="rich-links">
            <button class="back-button" type="button" id="backToFacilityList">Back to facility list</button>
          </div>
          <section class="rich-section">
            <h4>AI Summary</h4>
            <p>${data.summary}</p>
          </section>
          <section class="rich-section">
            <h4>Features</h4>
            <dl class="rich-grid">${rowsHtml(data.features)}</dl>
          </section>
          <section class="rich-section">
            <h4>Attachment Highlights</h4>
            <dl class="rich-grid">${objectRowsHtml(data.attachmentFacts)}</dl>
          </section>
          ${attachmentGalleryHtml(data.attachmentImages)}
          <section class="rich-section">
            <h4>Lease Highlights</h4>
            <p>End Date May 2027</p>
          </section>
          <section class="rich-section">
            <h4>Gallery</h4>
            <div class="gallery-grid">
              ${data.gallery.map(([src, alt]) => `
                <button class="gallery-photo enlarge-photo" type="button" data-src="${src}" data-alt="${alt}" aria-label="Enlarge ${alt}">
                  <img src="${src}" alt="${alt}" loading="lazy">
                </button>
              `).join("")}
            </div>
          </section>
          <section class="rich-section">
            <h4>Distribution Facility Facts</h4>
            <dl class="rich-grid">${rowsHtml(data.facts)}</dl>
          </section>
          <section class="rich-section">
            <h4>Property Overview</h4>
            <p>${data.overview}</p>
          </section>
          <div class="detail-map">
            <iframe
              title="${data.title} map"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps?q=${encodeURIComponent(data.mapQuery)}&z=${data.mapZoom}&output=embed">
            </iframe>
          </div>
          ${topCustomersSectionHtml("Valley View")}
          ${managerSectionHtml("Valley View")}
          <section class="rich-section">
            <h4>Business Hours</h4>
            <p>Monday - Friday 8am to 5pm</p>
          </section>
          <section class="rich-section">
            <h4>Amenities</h4>
            <div class="amenity-list">${data.amenities.map((item) => `<span>${item}</span>`).join("")}</div>
          </section>
          <section class="rich-section">
            <h4>Nearby</h4>
            <div class="nearby-list">
              ${data.nearby.map((group) => `
                <div class="nearby-card">
                  <strong>${group.title} (${group.items.length})</strong>
                  ${group.items.map(([name, type, address, distance, time]) => `
                    <span><b>${name}</b> · ${type}</span>
                    <span>${address}</span>
                    <span>${distance} · ${time}</span>
                  `).join("")}
                </div>
              `).join("")}
            </div>
          </section>
        </div>
      `;
      document.getElementById("backToFacilityList")?.addEventListener("click", resetSelection);
      bindEnlargePhotos();
    }

    function selectFacility(facility) {
      activeName = facility.name;
      document.querySelector(".side-panel").classList.add("rich-mode");
      selectedName.textContent = facility.name;
      selectedAddress.textContent = facility.address;
      detailMeta.hidden = false;
      futureSlot.hidden = false;
      selectedRegion.textContent = `${facility.city}, ${facility.state}`;
      selectedStatus.textContent = facility.verified ? "Address verified" : "Needs WISE confirmation";
      selectedStatus.className = facility.verified ? "pill" : "pill review";
      selectedStatus.hidden = false;
      futureSlot.textContent = `Placeholder for ${facility.name}. Future click content will go here.`;

      for (const item of facilities) {
        const entry = markers.get(item.name);
        if (entry) {
          entry.marker.className = markerClasses(item);
          entry.button.classList.toggle("is-active", item.name === activeName);
        }
      }

      if (facility.name === "Valley View") {
        renderValleyViewDetails();
      } else {
        renderGenericFacilityDetails(facility);
      }
    }

    function facilityMatches(facility, query) {
      const needle = query.trim().toLowerCase();
      if (!needle) return true;
      return [facility.name, facility.address, facility.city, facility.state]
        .join(" ")
        .toLowerCase()
        .includes(needle);
    }

    function renderList() {
      const query = searchInput?.value ?? "";
      const visible = facilities
        .filter((facility) => facilityMatches(facility, query))
        .sort((a, b) => {
          const stateCompare = (stateCodeToName[a.state] || a.state)
            .localeCompare(stateCodeToName[b.state] || b.state);
          return stateCompare || a.name.localeCompare(b.name);
        });
      list.innerHTML = "";

      if (!visible.length) {
        updateMarkerVisibility(query);
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No facilities match that search.";
        list.appendChild(empty);
        return;
      }

      let currentState = "";
      for (const facility of visible) {
        const stateName = stateCodeToName[facility.state] || facility.state;
        if (stateName !== currentState) {
          currentState = stateName;
          const heading = document.createElement("div");
          heading.className = "state-group-title";
          heading.textContent = stateName;
          list.appendChild(heading);
        }

        const button = document.createElement("button");
        button.className = `facility-button${facility.verified ? "" : " needs-review"}${facility.name === activeName ? " is-active" : ""}`;
        button.type = "button";
        button.innerHTML = `
          <span class="mini-star" aria-hidden="true">★</span>
          <span>
            <strong>${facility.name}</strong>
            <span>${facility.address}</span>
          </span>
        `;
        button.addEventListener("click", () => selectFacility(facility));
        list.appendChild(button);

        const entry = markers.get(facility.name);
        if (entry) entry.button = button;
      }

      updateMarkerVisibility(query);
    }

    function updateMarkerVisibility(query) {
      for (const facility of facilities) {
        const entry = markers.get(facility.name);
        if (!entry) continue;
        const shouldShow = facilityMatches(facility, query);
        entry.marker.hidden = !shouldShow;
      }
    }

    for (const facility of facilities) {
      const position = projectFacility(facility);
      const marker = document.createElement("button");
      marker.className = markerClasses(facility);
      marker.type = "button";
      marker.title = facility.name;
      marker.dataset.label = facility.name;
      marker.dataset.stateCode = facility.state;
      marker.setAttribute("aria-label", `Open ${facility.name}`);
      marker.style.left = `${position.x}%`;
      marker.style.top = `${position.y}%`;
      if (facility.priority) marker.style.zIndex = "12";
      marker.addEventListener("mouseenter", () => focusState(facility.state));
      marker.addEventListener("focus", () => focusState(facility.state));
      marker.addEventListener("click", () => selectFacility(facility));
      markerLayer.appendChild(marker);
      markers.set(facility.name, { marker, button: null });
    }

    document.querySelectorAll(".state-shape").forEach((shape) => {
      const stateCode = stateNameToCode[shape.dataset.state];
      shape.classList.toggle("has-facility", facilityStateCodes.has(stateCode));
      shape.addEventListener("mouseenter", () => focusState(stateCode));
      shape.addEventListener("focus", () => focusState(stateCode));
      shape.addEventListener("click", () => focusState(stateCode));
    });
    document.getElementById("map").addEventListener("mouseleave", clearStateFocus);
    window.facilityMapFocusState = focusState;
    window.facilityMapClearStateFocus = clearStateFocus;

    facilityCount.textContent = facilities.length;
    stateCount.textContent = new Set(facilities.map((facility) => facility.state)).size;

    searchInput?.addEventListener("input", renderList);
    function resetSelection() {
      if (searchInput) searchInput.value = "";
      activeName = "";
      document.querySelector(".side-panel").classList.remove("rich-mode");
      selectedName.textContent = "Select a facility";
      selectedAddress.textContent = "Click any star on the map or choose a facility from the list.";
      detailMeta.hidden = true;
      futureSlot.hidden = true;
      selectedRegion.textContent = "No facility selected";
      selectedStatus.textContent = "Ready";
      selectedStatus.className = "pill";
      selectedStatus.hidden = false;
      futureSlot.textContent = "Future click content will go here.";
      renderList();
    }

    document.getElementById("resetButton").addEventListener("click", resetSelection);
    closeImageLightbox.addEventListener("click", closeImagePreview);
    imageLightbox.addEventListener("click", (event) => {
      if (event.target === imageLightbox) closeImagePreview();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !imageLightbox.hidden) closeImagePreview();
    });

    renderList();
  </script>
</body>
</html>
